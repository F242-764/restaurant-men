<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إداراة الطلبات - المطعم</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; padding: 20px; }
    .admin-container { max-width: 900px; margin: 0 auto; }
    .order-card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; border-right: 5px solid #ff9800; }
    .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; font-weight: bold; }
    .order-item { font-size: 0.95rem; margin: 5px 0; color: #ccc; }
    .order-total { text-align: left; font-weight: bold; color: #4caf50; font-size: 1.1rem; margin-top: 10px; }
    .badge-table { background: #ff9800; color: #000; padding: 3px 8px; border-radius: 5px; }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1>🔔 لوحة إدارة الطلبات المباشرة</h1>
    <p>تتم تحديث الطلبات تلقائياً فور إرسالها من الطاولات...</p>
    <hr style="border-color: #333; margin-bottom: 20px;">

    <div id="orders-list">
      <p>جاري تحميل الطلبات...</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyApRa-o_DSAikev_sHEh1gaUGPFC9sJIBI",
      authDomain: "restaurant-app-31bbe.firebaseapp.com",
      projectId: "restaurant-app-31bbe",
      storageBucket: "restaurant-app-31bbe.firebasestorage.app",
      messagingSenderId: "284724591836",
      appId: "1:284724591836:web:f1eb2fd4581389ff2c0819",
      measurementId: "G-MNNFNSZ2BM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ordersList = document.getElementById("orders-list");

    // الاستماع المباشر للطلبات من Firebase
    const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      ordersList.innerHTML = "";
      
      if (snapshot.empty) {
        ordersList.innerHTML = "<p>لا يوجد طلبات حالياً.</p>";
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        const card = document.createElement("div");
        card.className = "order-card";

        let itemsHtml = "";
        if (data.items && Array.isArray(data.items)) {
          data.items.forEach(item => {
            itemsHtml += `
              <div class="order-item">
                • <b>${item.name}</b> (العدد: ${item.quantity}) ${item.notes ? `<span style="color:#f39c12;">[ملاحظة: ${item.notes}]</span>` : ''}
              </div>`;
          });
        }

        card.innerHTML = `
          <div class="order-header">
            <span class="badge-table">طاولة رقم: ${data.tableNumber || 'غير محددة'}</span>
            <span style="font-size:0.85rem; color:#aaa;">${data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString('ar-SY') : 'الآن'}</span>
          </div>
          <div>${itemsHtml}</div>
          <div class="order-total">الإجمالي: ${data.totalAmount ? data.totalAmount.toLocaleString() : 0} ل.س</div>
        `;

        ordersList.appendChild(card);
      });
    });
  </script>
</body>
</html>
