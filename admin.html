<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المطعم - إدارة الطاولات والطلبات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
    h1 { text-align: center; color: #ff9800; margin-bottom: 30px; }
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .order-card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
    .order-header h3 { margin: 0; color: #ff9800; font-size: 1.3rem; }
    .table-badge { background: #ff9800; color: #000; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
    .items-list { margin-bottom: 15px; }
    .item-row { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 8px; border-bottom: 1px dashed #2a2a2a; padding-bottom: 4px; }
    .item-note { color: #aaa; font-size: 0.85rem; margin-top: 2px; }
    .total-section { font-weight: bold; font-size: 1.1rem; color: #4CAF50; margin-top: 10px; text-align: left; }
    .close-btn { background: #f44336; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Tajawal', sans-serif; transition: background 0.3s; }
    .close-btn:hover { background: #d32f2f; }
    .empty-msg { text-align: center; color: #aaa; grid-column: 1 / -1; margin-top: 50px; font-size: 1.2rem; }
    .error-msg { background: #ffebee; color: #c62828; padding: 15px; border-radius: 8px; text-align: center; margin: 20px auto; max-width: 600px; }
  </style>
</head>
<body>

  <h1>📊 لوحة تحكم المطعم - الطاولات النشطة</h1>
  <div id="admin-orders-container" class="orders-grid">
    <p class="empty-msg">جاري تحميل الطلبات النشطة...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyApRa-o_DSAikev_sHEh1gaUGPFC9sJIBI",
      authDomain: "restaurant-app-31bbe.firebaseapp.com",
      projectId: "restaurant-app-31bbe",
      storageBucket: "restaurant-app-31bbe.firebasestorage.app",
      messagingSenderId: "284724591836",
      appId: "1:284724591836:web:f1eb2fd4581389ff2c0819",
      measurementId: "G-MNNFNSZ2BM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const container = document.getElementById("admin-orders-container");

    try {
      onSnapshot(collection(db, "orders"), (snapshot) => {
        container.innerHTML = "";
        if (snapshot.empty) {
          container.innerHTML = `<p class="empty-msg">لا توجد طلبات نشطة حالياً للطاولات.</p>`;
          return;
        }

        snapshot.forEach((document) => {
          const order = document.data();
          const orderId = document.id;

          const card = document.createElement("div");
          card.className = "order-card";
          
          let itemsHtml = "";
          let calculatedTotal = 0;

          if (order.items && Array.isArray(order.items)) {
            order.items.forEach(item => {
              const itemTotal = item.price * item.quantity;
              calculatedTotal += itemTotal;
              itemsHtml += `
                <div class="item-row">
                  <div>
                    <span>${item.name} (${item.quantity}x)</span>
                    ${item.notes ? `<div class="item-note">ملاحظة: ${item.notes}</div>` : ''}
                  </div>
                  <span>${itemTotal.toLocaleString()} ل.س</span>
                </div>
              `;
            });
          }

          card.innerHTML = `
            <div class="order-header">
              <h3>طلبية طاولة</h3>
              <span class="table-badge">طاولة ${order.tableNumber || 'غير محددة'}</span>
            </div>
            <div class="items-list">
              ${itemsHtml}
            </div>
            <div class="total-section">
              المجموع: ${calculatedTotal.toLocaleString()} ل.س
            </div>
            <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
            <button class="close-btn" onclick="closeTableSession('${orderId}')">إغلاق الطاولة والمحاسبة 🚪💵</button>
          `;
          container.appendChild(card);
        });
      }, (error) => {
        console.error("Firebase Snapshot Error:", error);
        container.innerHTML = `<div class="error-msg">خطأ في الاتصال بقاعدة البيانات: ${error.message}</div>`;
      });
    } catch (err) {
      console.error("Initialization Error:", err);
      container.innerHTML = `<div class="error-msg">حدث خطأ برمجي: ${err.message}</div>`;
    }

    window.closeTableSession = async function(orderId) {
      if (confirm("هل أنت متأكد من محاسبة الزبون وإغلاق الطاولة؟")) {
        try {
          await deleteDoc(doc(db, "orders", orderId));
          alert("تم إغلاق الطاولة بنجاح!");
        } catch (error) {
          console.error("Error closing table: ", error);
          alert("حدث خطأ أثناء إغلاق الطاولة.");
        }
      }
    };
  </script>

</body>
</html>
