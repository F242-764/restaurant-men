<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طباعة أكواد QR للطاولات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    .qr-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
    .qr-card { background: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 12px; width: 180px; page-break-inside: avoid; }
    .qr-card h3 { margin-bottom: 15px; color: #ff9800; font-size: 1.2rem; }
    .qrbox { background: #fff; padding: 10px; display: inline-block; border-radius: 8px; margin: 0 auto; }
    .controls { margin-bottom: 20px; }
    input, button { padding: 10px; font-size: 1rem; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; }
    button { background: #ff9800; color: #000; font-weight: bold; cursor: pointer; border: none; margin-right: 5px; }
    button:hover { background: #e68900; }
    .print-btn { background: #4CAF50; color: #fff; }

    /* تنسيق خاص عند الطباعة لتبدو احترافية على الورق */
    @media print {
      body { background: #fff; color: #000; }
      .controls, h1 { display: none; }
      .qr-card { background: #fff; border: 2px solid #000; color: #000; }
      .qr-card h3 { color: #000; }
    }
  </style>
</head>
<body>

  <h1>🖨️ توليد وطباعة أكواد QR للطاولات</h1>
  <div class="controls">
    <label>عدد الطاولات: </label>
    <input type="number" id="table-count" value="5" min="1" max="20" style="width: 70px;">
    <button onclick="generateQRs()">توليد الأكواد</button>
    <button class="print-btn" onclick="window.print()">🖨️ طباعة الأكواد مباشرة</button>
  </div>

  <div id="qr-list" class="qr-container"></div>

  <script>
    function generateQRs() {
      const count = document.getElementById("table-count").value;
      const container = document.getElementById("qr-list");
      container.innerHTML = "";

      const baseUrl = window.location.href.replace("qr.html", "index.html");

      for (let i = 1; i <= count; i++) {
        const card = document.createElement("div");
        card.className = "qr-card";
        card.innerHTML = `<h3>طاولة رقم ${i}</h3><div class="qrbox" id="qrcode-${i}"></div>`;
        container.appendChild(card);

        const targetUrl = `${baseUrl}?table=${i}`;
        
        new QRCode(document.getElementById(`qrcode-${i}`), {
          text: targetUrl,
          width: 128,
          height: 128,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    }

    window.onload = generateQRs;
  </script>
</body>
</html>
