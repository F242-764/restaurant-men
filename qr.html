<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توليد وتصدير أكواد الـ QR كصفحة A4</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
    .controls { margin-bottom: 20px; }
    input, button { padding: 10px; font-size: 1rem; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; }
    button { background: #ff9800; color: #000; font-weight: bold; cursor: pointer; border: none; margin-right: 5px; }
    button:hover { background: #e68900; }
    .print-btn { background: #4CAF50; color: #fff; }

    /* محاكاة ورقة A4 للطباعة */
    .a4-page {
      width: 210mm;
      min-height: 297mm;
      padding: 15mm;
      margin: 0 auto;
      background: #ffffff;
      color: #000;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      gap: 15px;
      box-sizing: border-box;
      border-radius: 4px;
    }

    .qr-card {
      background: #fff;
      border: 2px dashed #666;
      padding: 15px;
      border-radius: 10px;
      width: 140px;
      text-align: center;
      page-break-inside: avoid;
    }
    .qr-card h3 { margin: 0 0 10px 0; font-size: 1.1rem; color: #000; }
    .qrbox { background: #fff; display: inline-block; }

    /* تنسيق خاص عند الطباعة لضمان ظهور ورقة A4 فقط بدون أزرار */
    @media print {
      body { background: #fff; padding: 0; }
      .controls, h1 { display: none; }
      .a4-page { box-shadow: none; padding: 0; margin: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <h1>🖨️ تجهيز أكواد الـ QR للطباعة بحجم A4</h1>
  <div class="controls">
    <label>عدد الطاولات: </label>
    <input type="number" id="table-count" value="6" min="1" max="12" style="width: 70px;">
    <button onclick="generateQRs()">تحديث الأكواد</button>
    <button class="print-btn" onclick="window.print()">🖨️ طباعة أو حفظ كـ A4 (PDF/صورة)</button>
  </div>

  <!-- ورقة الـ A4 التي تحتوي على الأكواد مرتبة للقص -->
  <div id="qr-list" class="a4-page"></div>

  <script>
    function generateQRs() {
      const count = document.getElementById("table-count").value;
      const container = document.getElementById("qr-list");
      container.innerHTML = "";

      const baseUrl = window.location.href.replace("qr.html", "index.html");

      for (let i = 1; i <= count; i++) {
        const card = document.createElement("div");
        card.className = "qr-card";
        card.innerHTML = `<h3>طاولة ${i}</h3><div class="qrbox" id="qrcode-${i}"></div>`;
        container.appendChild(card);

        const targetUrl = `${baseUrl}?table=${i}`;
        
        new QRCode(document.getElementById(`qrcode-${i}`), {
          text: targetUrl,
          width: 110,
          height: 110,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    }

    window.onload = generateQRs;
  </script>
</body>
</html>
