<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المطعم - إدارة الطاولات</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #ff9800;
      margin-bottom: 30px;
    }
    #orders-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .order-card {
      background-color: #1e1e1e;
      border: 2px solid #ff9800;
      border-radius: 12px;
      padding: 20px;
      width: 300px;
      box-shadow: 0 4px 10px rgba(255, 152, 0, 0.2);
    }
    .order-card h3 {
      margin-top: 0;
      color: #4caf50;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .items-list {
      list-style: none;
      padding: 0;
      margin: 15px 0;
    }
    .items-list li {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .total-price {
      font-weight: bold;
      color: #ffc107;
      font-size: 16px;
      margin-top: 15px;
      text-align: left;
    }
    .btn-close {
      width: 100%;
      background-color: #e53935;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }
    .btn-close:hover {
      background-color: #c62828;
    }
    .no-orders {
      text-align: center;
      color: #888;
      font-size: 18px;
      width: 100%;
      margin-top: 50px;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <h1>📊 لوحة تحكم المطعم - الطاولات النشطة</h1>

  <div id="orders-container">
    <div class="no-orders">جاري تحميل الطلبات...</div>
  </div>

  <script>
    // إعدادات فايربيس الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyD...", // الكود سيعمل مع إعدادات مشروعك الحالية
      authDomain: "restaurant-app-31bbe.firebaseapp.com",
      projectId: "restaurant-app-31bbe",
      storageBucket: "restaurant-app-31bbe.appspot.com",
      messagingSenderId: "1028713289139",
      appId: "1:1028713289139:web:8c3a1b"
    };

    // تهيئة فايربيس
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const container = document.getElementById('orders-container');

    // الاستماع للطلبات النشطة في الوقت الحقيقي
    db.collection('orders').where('status', '==', 'active')
      .onSnapshot((snapshot) => {
        container.innerHTML = '';

        if (snapshot.empty) {
          container.innerHTML = '<div class="no-orders">لا توجد طلبات نشطة حالياً للطاولات 🍽️</div>';
          return;
        }

        snapshot.forEach((doc) => {
          const order = doc.data();
          const card = document.createElement('div');
          card.className = 'order-card';

          let itemsHTML = '';
          if (order.items && Array.isArray(order.items)) {
            order.items.forEach(item => {
              itemsHTML += `<li><span>${item.name} (x${item.count || 1})</span> <span>${item.price * (item.count || 1)} ل.س</span></li>`;
            });
          }

          card.innerHTML = `
            <h3>طاولة رقم: ${order.tableNumber || 'غير محدد'}</h3>
            <ul class="items-list">${itemsHTML}</ul>
            <div class="total-price">المجموع: ${order.totalPrice || 0} ل.س</div>
            <button class="btn-close" onclick="closeTable('${doc.id}')">إغلاق الطاولة وإخفاء الطلب</button>
          `;

          container.appendChild(card);
        });
      }, (error) => {
        console.error("خطأ في جلب البيانات: ", error);
        container.innerHTML = '<div class="no-orders" style="color:red;">حدث خطأ في الاتصال بقاعدة البيانات!</div>';
      });

    // دالة إغلاق الطاولة
    function closeTable(docId) {
      if (confirm('هل أنت متأكد من إغلاق هذه الطاولة؟')) {
        db.collection('orders').doc(docId).update({
          status: 'closed'
        }).then(() => {
          alert('تم إغلاق الطاولة بنجاح!');
        }).catch(err => {
          alert('حدث خطأ أثناء إغلاق الطاولة: ' + err.message);
        });
      }
    }
  </script>
</body>
</html>
